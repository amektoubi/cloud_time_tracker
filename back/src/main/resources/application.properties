quarkus.http.host=0.0.0.0
quarkus.datasource.db-kind=${DB_KIND:sqlite}
quarkus.datasource.jdbc.url=jdbc:sqlite:dev.db
quarkus.datasource.jdbc.max-size=16
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration/sqlite
quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.unsupported-properties."hibernate.type.preferred_uuid_jdbc_type"=VARCHAR
quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.path=/openapi


quarkus.http.cors.enabled=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS,HEAD,PATCH
quarkus.http.cors.headers=*
quarkus.http.cors.exposed-headers=*
quarkus.http.cors.credentials=false
quarkus.http.cors.max-age=24h

%prod.postgres.quarkus.datasource.db-kind=postgresql
%prod.postgres.quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cloud_time_tracker}
%prod.postgres.quarkus.datasource.username=${DB_USER:postgres}
%prod.postgres.quarkus.datasource.password=${DB_PASSWORD:postgres}
%prod.postgres.quarkus.datasource.jdbc.max-size=16
%prod.postgres.quarkus.flyway.migrate-at-start=true
%prod.postgres.quarkus.flyway.locations=db/migration/postgresql
%prod.postgres.quarkus.hibernate-orm.database.generation=none
%prod.quarkus.hibernate-orm.unsupported-properties."hibernate.type.preferred_uuid_jdbc_type"=UUID

